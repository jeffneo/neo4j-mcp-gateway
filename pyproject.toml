[project]
name = "neo4j-mcp-gateway"
version = "0.1.0"
description = "Local MCP gateway for Neo4j: proxies the official Neo4j MCP server and adds YAML-defined use-case tools, all behind one stdio endpoint."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.9.0",
    "neo4j>=5.20.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
]

[project.scripts]
neo4j-mcp-gateway = "gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
