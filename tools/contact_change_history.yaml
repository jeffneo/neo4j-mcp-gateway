# Forensic view of contact-detail changes (phone / email / address) with their
# OLD vs NEW values — for investigating a takeover and restoring the victim.
# Adapted from the Neo4j retail-banking ATO use case (section 5.6).
# Registered as tool:  usecase_contact_change_history
name: contact_change_history
description: >
  Forensic old-vs-new history of contact-detail changes (phone, email, address)
  made during sessions, one row per change. Pass a customer_id to scope to one
  customer, or leave it empty to see every change across all customers. Useful
  for investigating an account takeover and restoring the victim's details.
  Read-only.
parameters:
  - name: customer_id
    type: string
    description: Customer.customerId to investigate; empty string returns changes for all customers.
    required: false
    default: ""
  - name: limit
    type: integer
    description: Maximum number of change rows to return.
    required: false
    default: 50
# HINT:
#   - For each (Customer)-[:HAS_SESSION]->(Session), OPTIONAL MATCH HAS_CHANGE_PHONE/EMAIL/ADDRESS.
#   - Follow OLD_* / NEW_* to the value nodes. $customer_id = '' means 'all customers'.
#   - Return one row per change: type, time, old, new (a list-comprehension + UNWIND works well).
