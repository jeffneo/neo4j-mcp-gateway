# Ranks login sessions by account-takeover risk using observable graph signals
# only (never reads the isFraud/caseType ground-truth fields). Mirrors the
# scoring query in data/README.md.
# Registered as tool:  usecase_ato_session_triage
name: ato_session_triage
description: >
  Triage login sessions for account-takeover risk. Scores each session on
  new/untrusted device, high-risk or VPN/Tor IP, failed-login bursts, MFA
  bypass, password reset, contact-detail changes, and rapid transfers to a
  high-risk payee. Returns the highest-risk sessions first with the signal
  breakdown. Read-only; safe to run anytime.
parameters:
  - name: min_risk
    type: integer
    description: Only return sessions whose computed risk score is at least this value.
    required: false
    default: 0
  - name: limit
    type: integer
    description: Maximum number of sessions to return.
    required: false
    default: 25
