# Surfaces logins from a device NOT previously trusted for that customer — the
# classic first observable of an account takeover. Optionally filter to risky IPs.
# Registered as tool:  usecase_new_device_logins
name: new_device_logins
description: >
  List login sessions performed from a device that is not trusted for the
  customer (USED_BY.isTrusted = false) — the hallmark first step of an account
  takeover. Optionally restrict to sessions whose IP risk score is at least
  min_ip_risk. Read-only.
parameters:
  - name: min_ip_risk
    type: number
    description: Only include sessions whose originating IP risk score is at least this value (0 = no filter).
    required: false
    default: 0
# HINT:
#   - (Customer)-[:HAS_SESSION]->(Session)-[:SESSION_USES_DEVICE]->(Device)-[u:USED_BY]->(same Customer).
#   - Keep u.isTrusted = false. OPTIONAL MATCH the IP; filter coalesce(ip.riskScore,0) >= $min_ip_risk.
#   - Gotcha: don't alias ip.ipAddress AS ip — it shadows the node. Order by the aliased column.
