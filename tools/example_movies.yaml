# Canonical example — the documented use-case tool format.
# Works against the classic Neo4j "movies" sample graph (:Person)-[:ACTED_IN]->(:Movie).
# Registered as tool:  usecase_search_movies_by_actor
name: search_movies_by_actor
description: Find movies a given actor appeared in.
parameters:
  - name: actor
    type: string
    description: Full name of the actor
    required: true
cypher: |
  MATCH (p:Person {name: $actor})-[:ACTED_IN]->(m:Movie)
  RETURN m.title AS title, m.released AS year
  ORDER BY year
read_only: true
