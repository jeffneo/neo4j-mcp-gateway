# Bundle manifest (non-secret). Credentials go in a git-ignored .env beside this
# file, or are inherited from the repo-root .env.
name: {{BUNDLE_NAME}}-gateway
description: TODO — one line describing this use case.

# Model-facing framing. Be specific about the graph (node labels, relationships)
# and what the curated tools do — this is what the assistant reads to pick tools.
instructions: >
  TODO: describe the graph this bundle analyses and what the usecase_ tools do,
  so an assistant can choose the right tool from a plain-language question.

# REQUIRED — state how this bundle exposes data. There is no default: choosing
# 'open' should be a recorded decision, not something that happens by omission.
#   open     = tools read directly (fine when every consumer is uniformly entitled)
#   mediated = every read is entitlement-filtered against the caller's principals
security:
  mode: open
  # When mediated, also set:
  # permissions_property: "Permissions.Read"
  # protected_labels: [YourBusinessRecordLabel]

downstream:
  read_only: false        # set true to hide the downstream write-cypher tool
  # hide: [read-cypher]   # hide specific proxied tools from clients entirely

# Connection (URI/user/password/database) is NEVER set here — it comes from env:
# the root .env, overridden by an optional git-ignored .env in this folder. That
# lets this bundle target its own Neo4j instance without secrets in committed YAML.
