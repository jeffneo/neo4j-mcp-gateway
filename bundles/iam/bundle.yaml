# Identity & Access Management (IAM) bundle — query-mediation pattern.
# Select with:  ACTIVE_BUNDLE=iam
#
# Adapted from the IAM-aware Neo4j MCP fork: SSO identifies the user, the graph
# resolves the user's effective groups, and secure-read-cypher composes an
# authorization wrapper around a generated Cypher fragment before Neo4j runs it.
name: neo4j-iam-gateway
description: Investment-bank entitlements — identity-resolved, filtered reads over client data.

instructions: >
  This gateway enforces entitlement-aware access to an investment-banking graph.
  Domain nodes carry a list-valued `Permissions.Read` property naming the
  principals allowed to read that row. Entities: User, AdGroup, Desk, Client,
  ClientContact, Communication (client chats/emails), Request (client RFQs),
  Trade, Deal (wall-crossed, need-to-know) and ResearchNote. Relationships:
  MEMBER_OF, COVERS, PARTICIPANT_IN, WITH_CLIENT, WITH_CONTACT, SUBMITTED,
  BOOKED, FOR_CLIENT, BOOKED_ON, ON_BEHALF_OF, INVOLVES_CLIENT.
  A caller's effective principals are their identity, 'everyone', their
  AdGroupList, and groups reachable via MEMBER_OF — typically coverage teams
  (coverage-acme), desks (desk-rates-emea), ops-settlements,
  compliance-supervision, control-room and named deal teams.
  WORKFLOW: (1) call resolve-identity first to confirm the principal and its
  entitlement groups; (2) for every data question call secure-read-cypher with a
  read-only MATCH fragment WITHOUT a RETURN, the protectedVariables to authorize
  (e.g. ["t"] for trades), and a finalReturn for any projection or aggregate,
  which runs AFTER filtering. Results are already entitlement-filtered: rows the
  caller may not see simply do not appear, so never describe a result as the
  complete firm-wide picture. Raw read-cypher is intentionally unavailable
  because it would bypass the filter — do not attempt writes or unrestricted
  queries.

# Connection is env-only (root .env, overridden by a git-ignored bundles/iam/.env).
# IAM often lives on its own instance — drop a .env here with NEO4J_URI/USERNAME/
# PASSWORD/DATABASE to point this bundle there. See .env.example.

# REQUIRED. Every read is wrapped in an authorization prelude and filtered
# against the caller's principals before rows are returned.
security:
  mode: mediated
  permissions_property: "Permissions.Read"
  # Labels expected to carry the permissions property. scripts/validate_bundle.py
  # fails if any such record is missing it — without this guard an unpermissioned
  # business record would flow as reference data (fail open).
  protected_labels: [Communication, Request, Trade, Deal]

  # How readability is decided. 'both' is the steady state here, not a staging
  # post: relationship-derived entitlements are naturally paths, while
  # role-based ones ("supervision reads everything") are naturally list ACLs.
  grant_model: both
  grants:
    - label: Trade
      via: "(caller)-[:BOOKED]->(resource)"
      reason: "booked the trade"
    - label: Trade
      via: "(caller)-[:MEMBER_OF]->(:AdGroup)<-[:COVERED_BY]-(:Client)<-[:FOR_CLIENT]-(resource)"
      reason: "covers the client the trade was booked for"
    - label: Communication
      via: "(caller)-[:PARTICIPANT_IN]->(resource)"
      reason: "was a participant in the conversation"
    # A condition on the ROW rather than on reachability. Desk members see their
    # desk's flow up to the desk's own limit; above it, entitlement has to come
    # from somewhere else (the booker, coverage, supervision).
    - label: Trade
      via: "(caller)-[:ON_DESK]->(:Desk)<-[:BOOKED_ON]-(resource)"
      where: "resource.notional < 50000000"
      reason: "on the booking desk, within the desk notional limit"

  # Rules that WITHDRAW access someone otherwise holds. A restricted list is not
  # the absence of a grant — coverage still covers the client, the ACLs still
  # name their team — so it cannot be modelled by removing a grant. Deny wins
  # over every grant, and an ambiguous denial denies.
  denials:
    - label: Communication
      via: "(caller)-[:ON_DESK]->(:Desk)<-[:RESTRICTED_FOR]-(:Client)<-[:WITH_CLIENT]-(resource)"
      reason: "the client is on the restricted list for this caller's desk"
    - label: Trade
      where: "resource.restricted = true"
      reason: "the trade is flagged restricted"

  # Which property identifies a row of each governed label. explain-access uses
  # this to find the record a question is about.
  resource_keys:
    Trade: tradeId
    Communication: commId
    Request: requestId
    Deal: dealId

downstream:
  read_only: true   # official server never registers write-cypher
  # NOTE: raw read-cypher is hidden AUTOMATICALLY because security.mode is
  # mediated — it would bypass the filter. Set security.allow_unmediated_read to
  # override (logged loudly). get-schema stays exposed: text2cypher needs it, and
  # it discloses structure (labels, relationship types, property keys), not rows.
