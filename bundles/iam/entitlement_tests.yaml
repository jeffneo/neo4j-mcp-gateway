# Entitlement conformance cases.
#
# Each case states what a named principal MUST see and MUST NOT see. The negative
# assertions are the security tests: proving Joe can read his own thread is easy,
# proving he cannot read a colleague's private chat is the requirement.
#
# Run:  uv run python scripts/check_entitlements.py iam
# Exits non-zero on any failure, so it can gate CI and serve as review evidence.

cases:
  # ---------------------------------------------------------------------------
  # Private client communications — entitled to the participants, not the team.
  # ---------------------------------------------------------------------------
  - name: participant sees their own private client chat
    principal: anna.ross@bank.com
    match: |
      MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    must_see: [COMM-1001, COMM-1002]

  - name: coverage colleague cannot see a private 1:1 chat
    principal: joe.hart@bank.com
    match: |
      MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    must_see: [COMM-1002]
    must_not_see: [COMM-1001]

  - name: unrelated coverage sees no Acme communications
    principal: priya.natarajan@bank.com
    match: |
      MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    expect_count: 0

  # ---------------------------------------------------------------------------
  # Coverage parity — the canonical requirement: two salespeople covering the
  # same client must see exactly the same book, with no reconciliation.
  # ---------------------------------------------------------------------------
  - name: coverage team members see an identical request book
    same_for: [joe.hart@bank.com, sam.diaz@bank.com]
    match: |
      MATCH (:Client {name: 'Acme Corp'})-[:SUBMITTED]->(x:Request)
    scope: [x]
    return: "RETURN x.requestId AS id"
    id_field: id

  # ---------------------------------------------------------------------------
  # Booked trade — visible to the booker, the coverage team, the owning desk,
  # settlements and supervision; to nobody else.
  # ---------------------------------------------------------------------------
  - name: booker sees the trade they booked
    principal: anna.ross@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_see: [TRD-3001]

  - name: coverage team sees the client trade
    same_for: [anna.ross@bank.com, joe.hart@bank.com, sam.diaz@bank.com]
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId

  - name: owning desk sees the trade
    principal: tom.becker@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_see: [TRD-3001]

  - name: settlements sees the trade
    principal: olu.adeyemi@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_see: [TRD-3001]

  - name: unrelated coverage cannot see the trade
    principal: priya.natarajan@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_not_see: [TRD-3001]
    expect_count: 0

  - name: private side cannot see markets trades
    principal: david.okafor@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_not_see: [TRD-3001]
    expect_count: 0

  # ---------------------------------------------------------------------------
  # Information barrier — a wall-crossed deal is need-to-know only. Broad rights
  # in one domain must not imply access in another.
  # ---------------------------------------------------------------------------
  - name: named deal team sees the wall-crossed deal
    principal: david.okafor@bank.com
    match: |
      MATCH (x:Deal)-[:INVOLVES_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.dealId AS id"
    id_field: id
    must_see: [DEAL-4001]

  - name: supervision does not cross the information barrier
    principal: maria.chen@bank.com
    match: |
      MATCH (x:Deal)-[:INVOLVES_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.dealId AS id"
    id_field: id
    must_not_see: [DEAL-4001]
    expect_count: 0

  - name: sales cannot see the wall-crossed deal
    principal: anna.ross@bank.com
    match: |
      MATCH (x:Deal)-[:INVOLVES_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.dealId AS id"
    id_field: id
    expect_count: 0

  # ---------------------------------------------------------------------------
  # Supervision and firm-wide baselines.
  # ---------------------------------------------------------------------------
  - name: supervision sees all client communications firm-wide
    principal: maria.chen@bank.com
    match: |
      MATCH (x:Communication)
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    must_see: [COMM-1001, COMM-1002, COMM-1003]

  - name: published research is readable by everyone
    same_for:
      [anna.ross@bank.com, david.okafor@bank.com, olu.adeyemi@bank.com]
    match: |
      MATCH (x:ResearchNote)
    scope: [x]
    return: "RETURN x.noteId AS id"
    id_field: id

  # ---------------------------------------------------------------------------
  # Aggregates must be computed after filtering, not before. A total that leaks
  # the firm-wide number is as much a breach as leaking the rows.
  # ---------------------------------------------------------------------------
  - name: notional totals are per-entitlement, not firm-wide
    principal: joe.hart@bank.com
    match: |
      MATCH (:Client {name: 'Acme Corp'})-[:SUBMITTED]->(x:Request)
    scope: [x]
    return: "RETURN sum(x.notional) AS id"
    id_field: id
    must_see: [95000000.0]

  - name: an unentitled caller aggregates to zero, not to the real total
    principal: david.okafor@bank.com
    match: |
      MATCH (:Client {name: 'Acme Corp'})-[:SUBMITTED]->(x:Request)
    scope: [x]
    return: "RETURN count(x) AS id"
    id_field: id
    must_see: [0]

  # ---------------------------------------------------------------------------
  # Anchored tool. The harness additionally runs every anchored tool WITHOUT its
  # anchor and fails on any difference, which is what catches an anchor that
  # silently hides rows the caller is entitled to.
  # ---------------------------------------------------------------------------
  - name: covering salesperson sees their covered client trades
    principal: anna.ross@bank.com
    tool: covered_client_trades
    id_field: tradeId
    must_see: [TRD-3001]

  - name: non-covering salesperson sees no covered trades
    principal: priya.natarajan@bank.com
    tool: covered_client_trades
    id_field: tradeId
    must_not_see: [TRD-3001]

  - name: coverage parity holds on the anchored tool
    same_for: [anna.ross@bank.com, joe.hart@bank.com, sam.diaz@bank.com]
    tool: covered_client_trades
    id_field: tradeId

  # ---------------------------------------------------------------------------
  # Differential validation. `differential: true` runs the same question under the
  # materialised ACL model and under the configured grant model and fails on any
  # divergence — the migration argument, made checkable. It also reports where
  # pure `path` would diverge, which is how you find entitlement routes that are
  # role-based rather than relationship-derived.
  # ---------------------------------------------------------------------------
  - name: derived grants agree with materialised ACLs on client trades
    differential: true
    principals: [anna.ross@bank.com, joe.hart@bank.com, priya.natarajan@bank.com]
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId

  - name: derived grants agree with materialised ACLs on communications
    differential: true
    principals: [anna.ross@bank.com, joe.hart@bank.com]
    match: |
      MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Acme Corp'})
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id

  # ---------------------------------------------------------------------------
  # Denials — rules that WITHDRAW access someone otherwise holds. A restricted
  # list is not the absence of a grant: coverage still covers Acme and the ACLs
  # still name their team. Removing a grant could not express this.
  # ---------------------------------------------------------------------------
  # Priya is a PARTICIPANT in COMM-1003 — a path grant, the strongest route the
  # model has — and Zenith is restricted for her desk. She loses it. That is the
  # case that proves deny beats grant rather than merely coinciding with the
  # absence of one: removing a grant could not have expressed this, because the
  # grant is genuinely hers.
  - name: a denial overrides a grant the caller genuinely holds
    principal: priya.natarajan@bank.com
    match: "MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Zenith Industries'})"
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    must_not_see: [COMM-1003]
    expect_count: 0

  - name: the restriction is desk-scoped and does not reach supervision
    principal: maria.chen@bank.com
    match: "MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Zenith Industries'})"
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    must_see: [COMM-1003]

  # A restriction on one client must not bleed into another. Note these two
  # callers legitimately differ here — that is scenario 1, the private 1:1 — so
  # this asserts each one's own book rather than parity between them.
  - name: the restriction does not touch the unrestricted client
    principal: joe.hart@bank.com
    match: "MATCH (x:Communication)-[:WITH_CLIENT]->(:Client {name: 'Acme Corp'})"
    scope: [x]
    return: "RETURN x.commId AS id"
    id_field: id
    must_see: [COMM-1002]
    must_not_see: [COMM-1001]

  - name: a row-condition denial removes the flagged trade from supervision
    principal: maria.chen@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_not_see: [TRD-3002]

  # REGRESSION GUARD. An absent property yields NULL in Cypher, and an earlier
  # version treated a NULL denial predicate as "deny" — which denied every row
  # whose property was simply not set. TRD-3001 has no `restricted` property at
  # all, so it must survive a denial written as `resource.restricted = true`.
  - name: a denial predicate that is NULL does not deny
    principal: anna.ross@bank.com
    tool: client_activity
    args: {client: Acme Corp}
    id_field: tradeId
    must_see: [TRD-3001]

  # ---------------------------------------------------------------------------
  # INVARIANTS — questions about the MODEL, not about a caller.
  #
  # These run unmediated against the whole graph, because their job is to see
  # everything and report what should not be connected. No tool exposes them and
  # the gateway never runs them; they belong in CI and in a control-room review.
  # Each returns one row per violation, and `expect_count` says how many are
  # tolerated.
  # ---------------------------------------------------------------------------

  # Every principal named in an access-control list must exist. A name that no
  # longer resolves is a grant to nobody — harmless until the name is REUSED,
  # at which point it silently becomes a grant to someone new.
  - name: "invariant: every ACL entry names a principal that exists"
    invariant: |
      MATCH (n) WHERE n.`Permissions.Read` IS NOT NULL
      UNWIND n.`Permissions.Read` AS entry
      WITH DISTINCT entry
      WHERE entry <> 'everyone'
        AND NOT EXISTS { MATCH (g:AdGroup {name: entry}) }
        AND NOT EXISTS { MATCH (u:User {email: entry}) }
      RETURN entry AS danglingPrincipal
    expect_count: 0

  # A protected record nobody can read is usually a mistake — a row that fell out
  # of the entitlement model rather than one deliberately sealed.
  - name: "invariant: no protected record is unreachable by everyone"
    invariant: |
      MATCH (n) WHERE n.`Permissions.Read` IS NOT NULL
      WITH n WHERE size(n.`Permissions.Read`) = 0
      RETURN labels(n)[0] AS label, coalesce(n.tradeId, n.commId, n.dealId) AS id
    expect_count: 0

  # SEPARATION OF DUTY. Someone who both sits on a desk and holds a relationship
  # to a client restricted FOR that desk holds the two halves of a barrier at
  # once. No per-caller test can find this: it is a property of the graph rather
  # than of any one request, and the filter correctly denies each individual read
  # while the structural conflict quietly persists.
  #
  # expect_count is 1, not 0, and that is the point. Priya was already a
  # participant on Zenith when the restriction was applied to her desk — which is
  # exactly how this arises in practice, restrictions landing on relationships
  # that already exist. Someone has to decide whether to unwind her involvement
  # or accept it with reads denied. Recording the count makes that a REVIEWED
  # decision and turns any SECOND bridge into a failed build.
  - name: "invariant: no new bridge between a desk and a client restricted for it"
    invariant: |
      MATCH (u:User)-[:ON_DESK]->(d:Desk)<-[:RESTRICTED_FOR]-(c:Client)
      MATCH (u)-[:PARTICIPANT_IN]->(:Communication)-[:WITH_CLIENT]->(c)
      RETURN DISTINCT u.email AS bridges, d.name AS desk, c.name AS restrictedClient
    expect_count: 1
