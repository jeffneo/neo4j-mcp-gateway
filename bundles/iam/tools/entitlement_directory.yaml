# Mediated form: match -> (engine inserts auth prelude + entitlement filter) -> return.
#
# SCOPE: identity/reference metadata only. AdGroup and User carry no
# `Permissions.Read`, so they flow as reference data — which is the correct
# treatment for the entitlement model itself. Business records are only reachable
# through tools whose scope variables carry an ACL.
name: entitlement_directory
description: >
  List the entitlement groups in the identity model (coverage teams, desks,
  operations, control functions, named deal teams) with their members. Reference
  metadata for explaining WHY a caller can see something; returns no client
  business records.
parameters:
  - name: group_name
    type: string
    description: Filter to a single group name (e.g. coverage-acme). Empty string returns all groups.
    required: false
    default: ""
match: |
  MATCH (g:AdGroup)
  WHERE $group_name = '' OR g.name = $group_name
  OPTIONAL MATCH (u:User)-[:MEMBER_OF]->(g)
scope: [g, u]
return: |
  RETURN g.name AS group,
         g.kind AS kind,
         count(u) AS memberCount,
         collect(u.email) AS members
  ORDER BY kind, group
read_only: true
