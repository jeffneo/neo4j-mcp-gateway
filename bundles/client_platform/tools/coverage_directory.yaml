# Identity/reference metadata only — which teams exist and who is in them. Useful
# for explaining WHY someone can see something. Touches no permissioned records.
name: coverage_directory
description: >
  Entitlement groups in the identity model — coverage teams, product specialists
  and control functions — with their members. Reference metadata; returns no
  client business records.
parameters:
  - name: kind
    type: string
    description: Filter by group kind (coverage, product, control). Empty returns all.
    required: false
    default: ""
match: |
  MATCH (g:AdGroup)
  WHERE $kind = '' OR g.kind = $kind
  OPTIONAL MATCH (m:User)-[:MEMBER_OF]->(g)
scope: [g, m]
return: |
  RETURN g.name AS team, g.kind AS kind, g.label AS description,
         count(m) AS members, collect(m.email) AS memberEmails
  ORDER BY kind, team
read_only: true
