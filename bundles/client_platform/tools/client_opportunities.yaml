# The cross-sell pipeline. Commercially sensitive — stage and value — so it is
# permissioned to the coverage team, the relevant product specialists, platform
# administration and supervision.
name: client_opportunities
description: >
  Open cross-sell opportunities, optionally for one client. Shows the product,
  stage, value and the rationale recorded by coverage. Filtered to what the
  caller is entitled to see, so the pipeline total is theirs, not the firm's.
parameters:
  - name: client
    type: string
    description: Client name to filter by. Empty string returns all the caller may see.
    required: false
    default: ""
match: |
  MATCH (o:Opportunity)-[:FOR_CLIENT]->(c:Client)
  WHERE $client = '' OR c.name = $client
  MATCH (o)-[:FOR_PRODUCT]->(p:Product)
scope: [o, c, p]
protect: [o]
return: |
  RETURN c.name AS client, p.name AS product, o.stage AS stage,
         o.value AS value, o.currency AS currency, o.rationale AS rationale
  ORDER BY value DESC
read_only: true
