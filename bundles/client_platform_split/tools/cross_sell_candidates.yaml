# The commercial payoff query: products a client does NOT have that comparable
# clients DO. Peers are clients in the same segment or region.
#
# Peer counts are computed AFTER entitlement filtering, so a caller with narrow
# coverage gets a narrower — and honest — recommendation rather than a firm-wide
# one they could not act on.
#
# Note what this tool deliberately does NOT do: join to Opportunity. A permissioned
# node reached by OPTIONAL MATCH does not become null when the caller cannot read
# it — the entitlement filter drops the whole row. Mixing reference data and
# permissioned data in one query therefore loses rows the caller was entitled to.
# Opportunities live in their own tool for that reason.
name: cross_sell_candidates
description: >
  Suggest products for a client based on what comparable clients already use.
  Returns each candidate product and how many peers subscribe. Peer counts
  reflect only the clients the caller is entitled to see.
parameters:
  - name: client
    type: string
    description: Client name to generate suggestions for
    required: true
match: |
  MATCH (target:Client {name: $client})
  MATCH (peer:Client)-[:SUBSCRIBES_TO]->(p:Product)
  WHERE peer <> target
    AND (peer.segment = target.segment OR peer.region = target.region)
    AND NOT EXISTS { MATCH (target)-[:SUBSCRIBES_TO]->(p) }
scope: [target, peer, p]
return: |
  RETURN p.code AS product, p.name AS productName, p.family AS family,
         count(DISTINCT peer) AS peersUsing
  ORDER BY peersUsing DESC, product
read_only: true
sample_args:
  client: "Rivermark Industries"
