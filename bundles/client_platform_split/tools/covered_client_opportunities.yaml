# ANCHORED, with identity in a different database.
#
# The anchor is authored from `caller`, exactly as it would be in a co-located
# bundle. The engine cuts it at the identity/data boundary and re-roots the
# data-side half at the AdGroup proxy, so the query starts from the clients this
# caller's teams cover instead of scanning every opportunity and discarding.
#
# Measured on 100,000 rows at 1% visibility (scripts/bench_separation.py):
# 6.2 ms / 17,008 db hits anchored, against 79 ms / 1,302,001 unanchored — the
# same benefit anchoring gives co-located, which is why separation does not have
# to cost it.
#
# The entitlement filter STILL runs over the whole scope afterwards, so a
# too-broad anchor cannot leak. A too-narrow one hides rows the caller was
# entitled to, which is why check_entitlements.py re-runs every anchored tool
# without its anchor and fails on any difference.
name: covered_client_opportunities
description: >
  Open cross-sell opportunities for the clients the caller's coverage teams
  cover. Same entitlement result as client_opportunities, reached by traversing
  from the caller's teams rather than scanning the pipeline.
parameters:
  - name: min_value
    type: number
    description: Only include opportunities at or above this value
    required: false
    default: 0
anchor:
  variable: c
  via: "(caller)-[:MEMBER_OF]->(:AdGroup)<-[:COVERED_BY]-(c:Client)"
match: |
  MATCH (o:Opportunity)-[:FOR_CLIENT]->(c)
  WHERE o.value >= $min_value
  MATCH (o)-[:FOR_PRODUCT]->(p:Product)
scope: [o, c, p]
protect: [o]
return: |
  RETURN c.name AS client, p.name AS product, o.stage AS stage,
         o.value AS value, o.currency AS currency
  ORDER BY value DESC
read_only: true
