# Usage is permissioned: it reveals how much a client actually engages, which is
# commercially sensitive. Not anchored — a product specialist reaches this by
# role rather than by coverage, so an anchor on coverage would hide their rows.
name: client_engagement
description: >
  Product engagement for a client — sessions, API calls and trend per product.
  Shows where adoption is strong and where it is slipping.
parameters:
  - name: client
    type: string
    description: Client name, e.g. "Northwind Asset Management"
    required: true
match: |
  MATCH (u:UsageSummary)-[:FOR_CLIENT]->(c:Client {name: $client})
  MATCH (u)-[:FOR_PRODUCT]->(p:Product)
scope: [u, c, p]
protect: [u]
return: |
  RETURN p.name AS product, p.family AS family, u.period AS period,
         u.sessions AS sessions, u.apiCalls AS apiCalls, u.trend AS trend
  ORDER BY sessions DESC
read_only: true
sample_args:
  client: "Northwind Asset Management"
